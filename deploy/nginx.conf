# nginx reverse proxy for IntrinsicFinEd — fronts the FastAPI backend (:8000)
# and the RAG server (:3001). All RAG protection lives HERE, never in
# rag/server.py (which is untouchable): origin pinning, per-IP rate limits,
# body caps, path allowlisting, and stripping its wildcard CORS header.
#
# Topology:  Cloudflare edge  ->  cloudflared tunnel  ->  this nginx (127.0.0.1:8080)
#            api.intrinsicfined.org  ->  FastAPI  127.0.0.1:8000
#            ai.intrinsicfined.org   ->  RAG      127.0.0.1:3001
#
# Windows: run as   C:\nginx\nginx.exe -c C:\Users\Zaki_Mir\Downloads\files\deploy\nginx.conf
# nginx is installed at C:\nginx. All paths below are absolute so this config
# works regardless of the working directory it's launched from (important once
# it runs as an NSSM service).

worker_processes  1;
error_log  C:/nginx/logs/error.log;
pid        C:/nginx/logs/nginx.pid;
# access_log below (in http{}) — must also be absolute for the same reason.

events { worker_connections 1024; }

http {
    include       C:/nginx/conf/mime.types;
    default_type  application/octet-stream;
    access_log    C:/nginx/logs/access.log;
    sendfile      on;
    keepalive_timeout  65;

    # Our map{} blocks below key on full origin URLs (longer than nginx's
    # default hash bucket), so this must be raised or nginx refuses to start.
    map_hash_bucket_size 128;

    # Absolute temp paths — without these nginx resolves them relative to the
    # CURRENT WORKING DIRECTORY of whatever process launched it (not the
    # nginx.exe location), which breaks once this runs as an NSSM service.
    # nginx checks for all five even though this config only proxies.
    client_body_temp_path C:/nginx/temp/client_body_temp;
    proxy_temp_path       C:/nginx/temp/proxy_temp;
    fastcgi_temp_path     C:/nginx/temp/fastcgi_temp;
    uwsgi_temp_path       C:/nginx/temp/uwsgi_temp;
    scgi_temp_path        C:/nginx/temp/scgi_temp;

    # Real client IP: cloudflared forwards Cloudflare's CF-Connecting-IP. Fall
    # back to remote_addr for local testing. Rate limits key on this so one
    # abusive visitor can't be masked behind the tunnel's single loopback IP.
    map $http_cf_connecting_ip $client_ip {
        default   $http_cf_connecting_ip;
        ""        $remote_addr;
    }

    # Only the production site origin may make cross-origin browser calls.
    # $cors_allow_origin echoes the origin when allowed, else empty.
    map $http_origin $cors_allow_origin {
        default                              "";
        "https://intrinsicfined.org"         $http_origin;
        "https://www.intrinsicfined.org"     $http_origin;
    }
    # $origin_blocked = 1 only when a browser Origin is present AND not allowed.
    # Empty Origin (non-browser client / same-origin) is never blocked.
    map $http_origin $origin_blocked {
        default                              1;
        ""                                   0;
        "https://intrinsicfined.org"         0;
        "https://www.intrinsicfined.org"     0;
    }

    # Rate-limit zones (token buckets keyed per real client IP).
    limit_req_zone $client_ip zone=api_zone:10m   rate=120r/m;
    limit_req_zone $client_ip zone=ask_zone:10m   rate=3r/m;
    limit_req_zone $client_ip zone=explain_zone:10m rate=6r/m;
    limit_req_zone $client_ip zone=define_zone:10m rate=10r/m;
    limit_req_zone $client_ip zone=health_zone:10m rate=30r/m;
    limit_req_status 429;

    # Security headers applied to every response below.
    # (add_header in a location replaces inherited ones, so we re-declare per block.)

    # ── FastAPI backend ──────────────────────────────────────────────────────
    server {
        listen 127.0.0.1:8080;
        server_name api.intrinsicfined.org;

        client_max_body_size 256k;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $client_ip;
            proxy_set_header X-Forwarded-For   $client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
    }

    # ── RAG server (token-spending; strictly limited) ────────────────────────
    server {
        listen 127.0.0.1:8080;
        server_name ai.intrinsicfined.org;

        client_max_body_size 1m;       # page-context `data` blocks can be large; RAG's own limit backstops

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        # Strip the app's wildcard CORS and pin our origin instead. Answer the
        # preflight here so the "*" from rag/server.py never reaches a browser.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        # Answer routes go through the heartbeat proxy (ai_proxy.py :3002), which
        # streams keep-alive bytes so a >100s /ask survives Cloudflare's edge
        # timeout. /health can hit the RAG server (:3001) directly.
        set $rag http://127.0.0.1:3002;

        # Anything not explicitly allowed below is refused.
        location / {
            return 404;    # only the explicit routes below are exposed
        }

        # Each POST route answers its own OPTIONS preflight (nginx only allows
        # add_header inside an `if` when that `if` is nested in a location —
        # not directly in server — so this can't be a single shared block).
        location = /ask {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $cors_allow_origin always;
                add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type" always;
                add_header Access-Control-Max-Age 600 always;
                add_header Content-Length 0;
                return 204;
            }
            if ($origin_blocked) { return 403; }
            limit_req zone=ask_zone burst=2 nodelay;
            add_header Access-Control-Allow-Origin $cors_allow_origin always;
            proxy_pass $rag;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $client_ip;
            proxy_buffering off;              # stream heartbeats through immediately
            proxy_read_timeout 600s;          # heartbeats keep this alive; ceiling only
        }

        location = /explain {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $cors_allow_origin always;
                add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type" always;
                add_header Access-Control-Max-Age 600 always;
                add_header Content-Length 0;
                return 204;
            }
            if ($origin_blocked) { return 403; }
            limit_req zone=explain_zone burst=3 nodelay;
            add_header Access-Control-Allow-Origin $cors_allow_origin always;
            proxy_pass $rag;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }

        location = /define {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  $cors_allow_origin always;
                add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type" always;
                add_header Access-Control-Max-Age 600 always;
                add_header Content-Length 0;
                return 204;
            }
            if ($origin_blocked) { return 403; }
            limit_req zone=define_zone burst=4 nodelay;
            add_header Access-Control-Allow-Origin $cors_allow_origin always;
            proxy_pass $rag;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }

        location = /health {
            limit_req zone=health_zone burst=5 nodelay;
            add_header Access-Control-Allow-Origin $cors_allow_origin always;
            proxy_pass http://127.0.0.1:3001;   # health checks the RAG server directly
            proxy_set_header Host $host;
        }
    }
}
